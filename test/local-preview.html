<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anteprima locale - donation form</title>
  <style>
    /* Simula le variabili del sito Webflow (nel sito vere ci sono gia'). */
    :root{--font-family:"Switzer Variable";--color--paper:white;--color--paper-warm:#f9f5ec;--color--sand:#ebddc1;--color--sand-deep:#e3d0aa;--color--gold:#cea146;--color--gold-light:#d6bb84;--color--gold-deep:#8a6a2a;--color--ink:#1c1a17;}
    body { margin:0; font-family:Helvetica, Arial, sans-serif; background:var(--color--paper-warm); color:var(--color--ink); }
    .page { padding:4rem 1rem; }
    nav { max-width:36rem; margin:0 auto 2rem; font-size:.875rem; }
    nav a { margin-right:.75rem; color:var(--color--gold-deep); }
  </style>
</head>
<body>
  <div class="page">
    <!-- Simula i link della pagina Spenden di Webflow: stessa pagina del form, ?level= diverso -->
    <nav>
      <a href="?level=PULSE">PULSE</a><a href="?level=FLOW">FLOW</a><a href="?level=RESONANCE">RESONANCE</a><a href="?level=ECHO">ECHO</a>
    </nav>
    <div data-oa-donation-form></div>
  </div>

  <!-- Solo anteprima: l'endpoint locale non esiste, il pagamento non parte. In produzione si toglie data-endpoint. -->
  <script src="../public/donation-form.js" data-endpoint="http://localhost:3000/api/session" data-terms-de="/de/agb" data-terms-en="/en/agb" data-terms-it="/it/agb" defer></script>
</body>
</html>
