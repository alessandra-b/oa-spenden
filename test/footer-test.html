<!doctype html>
<html lang="it-CH">
<head><meta charset="utf-8"><title>TEST footer newsletter</title></head>
<body>
  <!-- Stessa struttura del form newsletter nel footer Webflow -->
  <div class="w-form">
    <form id="wf-form-Newsletter-subscription" name="wf-form-Newsletter-subscription" data-name="Newsletter subscription" method="get">
      <input class="text-field w-input" maxlength="256" name="Email" data-name="Email" placeholder="" type="email" id="email" required>
      <input type="submit" data-wait="Please wait..." class="footer-form-submit w-button" value="" disabled>
    </form>
    <div class="w-form-done" style="display:none"><div>Fast geschafft!</div></div>
    <div class="w-form-fail" style="display:none"><div>Das hat leider nicht geklappt.</div></div>
  </div>
  <script>
    // Simula il gestore di Webflow: se viene chiamato, il nostro script non ha funzionato.
    window.webflowSubmitted = 0;
    // Simula Turnstile che non arriva: Webflow lascia (e rimette) il bottone disattivato.
    setTimeout(function () { document.querySelector('#wf-form-Newsletter-subscription [type=submit]').disabled = true; }, 300);
    document.getElementById('wf-form-Newsletter-subscription').addEventListener('submit', function (e) { e.preventDefault(); window.webflowSubmitted++; });
  </script>
  <script src="/newsletter-footer.js" data-endpoint="/api/newsletter" defer></script>
</body>
</html>
